name: Build Android APK From Scratch

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع (index.html, main.js, style.css, icon.png)
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. إعداد بيئة جافا (Java 17 المطلوبة لبناء الأندرويد)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. نقل ملفات الويب وتجهيز بنية المجلدات لتوافق Capacitor
      - name: Prepare Web Directory and Config
        run: |
          # إنشاء مجلد مخصص للويب لتجنب خطأ الجذر "."
          mkdir -p www
          
          # نسخ ملفات الويب الأساسية الخاصة بك إلى المجلد الجديد
          cp index.html www/
          cp main.js www/
          cp style.css www/
          cp icon.png www/
          
          # إنشاء ملف package.json افتراضي في السطح
          echo '{"name": "my-app", "version": "1.0.0", "dependencies": {}, "devDependencies": {}}' > package.json
          
          # إنشاء إعدادات Capacitor لتشير إلى المجلد المخصص "www"
          echo '{"appId": "com.mycompany.myapp", "appName": "MyCapacitorApp", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      # 5. تثبيت حزم Capacitor الأساسية والمنصة الخاصة بالأندرويد
      - name: Install Capacitor Core & Android CLI
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android

      # 6. إنشاء مجلد الأندرويد ومزامنة ملفات الويب بشكل صحيح
      - name: Create and Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      # 7. حل مشكلة تكرار كلاسات Kotlin (تعديل الـ build.gradle المنشأ)
      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          echo "configurations.all { resolutionStrategy { eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } } }" >> android/app/build.gradle

      # 8. بناء التطبيق واستخراج ملف الـ APK (Debug) باستخدام Gradle
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. رفع ملف الـ APK لتتمكن من تحميله وتشغيله على هاتفك مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
