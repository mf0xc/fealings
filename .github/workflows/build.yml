name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود ومجلد الأندرويد من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (Java 17 متوافقة مع إصدارات Gradle الحديثة)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. حل مشكلة تكرار كلاسات Kotlin (تعديل الـ build.gradle برمجياً لمنع التعارض)
      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          if [ -d "android" ]; then
            echo "configurations.all { resolutionStrategy { eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } } }" >> android/app/build.gradle
          fi

      # 4. بناء ملف الـ APK (Debug) باستخدام Gradle مباشرة
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. رفع ملف الـ APK المستخرج لتحميله من الـ Artifacts بعد انتهاء البناء
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
