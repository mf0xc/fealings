name: Build Android APK From Scratch

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. إعداد بيئة جافا (Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. نقل ملفات الويب وتجهيز بنية المجلدات مع تسمية التطبيق (مشاعر-Fealing)
      - name: Prepare Web Directory and Config
        run: |
          mkdir -p www
          cp index.html www/
          cp main.js www/
          cp style.css www/
          cp icon.png www/
          
          # إعداد ملف الأصول ليتعرف على الأيقونة الخاصة بك في جذر المشروع
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          cp icon.png assets/icon-background.png
          
          echo '{"name": "fealings-app", "version": "1.0.0", "dependencies": {}, "devDependencies": {}}' > package.json
          echo '{"appId": "com.fealings.app", "appName": "مشاعر-Fealing", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      # 5. تثبيت حزم Capacitor وأداة توليد الأيقونات الرسمية
      - name: Install Capacitor & Assets Generator
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/assets --save-dev

      # 6. إنشاء مجلد الأندرويد والمزامنة
      - name: Create and Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      # 7. توليد أيقونات التطبيق الرسمية برمجياً من صورتك icon.png
      - name: Generate Android App Icons
        run: |
          npx capacitor-assets generate --android

      # 8. حل مشكلة تكرار كلاسات Kotlin
      - name: Fix Kotlin Duplicate Classes Conflict
        run: |
          echo "configurations.all { resolutionStrategy { eachDependency { details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } } }" >> android/app/build.gradle

      # 9. بناء التطبيق واستخراج ملف الـ APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 10. رفع ملف الـ APK النهائي بالاسم والأيقونة الجديدة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: مشاعر-Fealing-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
