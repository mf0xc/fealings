name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: npx cap init "حمودي وفوفو" com.feelings.app --web-dir www

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html www/
          cp main.js www/
          cp style.css www/

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate Android Icons from icon.png
        run: |
          pip install Pillow
          python3 << 'PYEOF'
          from PIL import Image
          import os

          icon = Image.open('icon.png').convert('RGBA')
          base_dir = 'android/app/src/main/res'

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          for folder, size in sizes.items():
              path = os.path.join(base_dir, folder)
              os.makedirs(path, exist_ok=True)
              resized = icon.resize((size, size), Image.LANCZOS)
              resized.save(os.path.join(path, 'ic_launcher.png'), 'PNG')
              resized.save(os.path.join(path, 'ic_launcher_foreground.png'), 'PNG')
              resized.save(os.path.join(path, 'ic_launcher_round.png'), 'PNG')

          print("Icons generated!")
          PYEOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamoodi-fofo-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
